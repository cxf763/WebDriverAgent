name: Build Unsigned WDA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WDA
        run: |
          xcodebuild build-for-testing -scheme WebDriverAgentRunner -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Release-iphoneos/WebDriverAgentRunner-Runner.app Payload/
          zip -r WDA.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WDA-unsigned
          path: WDA.ipa
