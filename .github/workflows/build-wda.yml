name: Build Unsigned WDA

on:
  workflow_dispatch:

jobs:
  build:
    # 现在的 macos-latest 是 macOS 15 arm64 + Xcode 26.x，日志里已经能编译成功；
    # 想固定版本可以改成 macos-15 并配合 maxim-lobanov/setup-xcode 指定 Xcode。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build WDA
        run: |
          set -euo pipefail

          # 关键点 1: 显式指定 -derivedDataPath build，否则产物在
          # ~/Library/Developer/Xcode/DerivedData/... 下，后续 cp 必然找不到。
          # 关键点 2: 用 -destination generic/platform=iOS 而不是 -sdk iphoneos，
          # 避免 xcodebuild 在多台 destination 里“猜”。
          # 关键点 3: ARCHS=arm64，真机不需要别的架构。
          xcodebuild clean build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          test -d "$APP"

          rm -rf Payload WDA.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/

          # 和仓库自带 Scripts/ci/build-real.sh 一致：真机包不要带 Xcode 塞进
          # 顶层 Frameworks 的 XCTest 依赖，装到设备上会优先用 DeveloperDiskImage 里的。
          rm -rf Payload/WebDriverAgentRunner-Runner.app/Frameworks

          zip -qry WDA.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WDA-unsigned
          path: WDA.ipa
          if-no-files-found: error
          retention-days: 7
